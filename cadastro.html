<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince of Games - Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <div class="logo"></div>
    <navbar>
        <a href="index.html">Início</a>
        <a href="login.html">Login</a>
    </navbar>
</header>
<main>
    <section class="formulario-container">
        <div class="formulario">
            <h1>CRIAR CONTA</h1>
            <p>
                Cadastre-se para comprar seus jogos favoritos.
            </p>
            <form id="formCadastro">
                <label>Nome</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
                
                <label>E-mail</label>                
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
                
                <label>Senha</label>                
                <input type="password" id="senha" placeholder="Digite sua senha" required>
                
                <label>Confirmar senha</label>                
                <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required>
                
                <button type="submit" class="botao">CADASTRAR
                </button>
            </form>
            <p class="mensagem" id="mensagemCadastro"></p>
            <p>Já possui uma conta?<a href="login.html">Faça login</a></p>
        </div>
    </section>
</main>
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
